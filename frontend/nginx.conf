server {
    listen 80;
    root /usr/share/nginx/html;

    # Photos can be a few MB each (4 photos + audio per session).
    client_max_body_size 50m;

    # Basic security headers.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # Docker's internal DNS. Using a variable in proxy_pass makes nginx look up
    # "api" again (every 10 s) instead of only at startup, so restarting the API
    # container (which may get a new IP address) does not break the site.
    resolver 127.0.0.11 valid=10s;
    set $api_upstream http://api:8000;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri /index.html;
    }
}
