# Full local stack:  docker compose up --build
#   frontend → http://localhost:3000     API docs → http://localhost:8000/docs
name: snapclass

# Settings shared by every backend container (API, worker, scheduler, migrate).
x-backend: &backend
  build:
    context: ./backend
    args:
      INSTALL_DEV: "true" # include pytest/ruff so tests can run inside the container
  image: snapclass-backend
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://snapclass:${POSTGRES_PASSWORD:-snapclass}@db:5432/snapclass
    TEST_DATABASE_URL: postgresql+psycopg://snapclass:${POSTGRES_PASSWORD:-snapclass}@db:5432/snapclass_test
    REDIS_URL: redis://redis:6379/0
    MEDIA_DIR: /data/media
  volumes:
    - media:/data/media
  restart: unless-stopped

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: snapclass
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-snapclass}
      POSTGRES_DB: snapclass
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snapclass"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  # Runs database migrations + seed data once, then exits.
  migrate:
    <<: *backend
    command: sh -c "alembic upgrade head && python -m snapclass.scripts.seed"
    restart: "no"
    depends_on:
      db: { condition: service_healthy }

  api:
    <<: *backend
    command: uvicorn snapclass.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      retries: 5
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    <<: *backend
    command: python -m snapclass.workers.run_worker
    deploy:
      replicas: 2 # spec A.4: 2–3 workers clear a 100-session burst
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  scheduler:
    <<: *backend
    command: python -m snapclass.workers.scheduler
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  media:
