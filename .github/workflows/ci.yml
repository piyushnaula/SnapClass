name: ci
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: snapclass
          POSTGRES_PASSWORD: test
          POSTGRES_DB: snapclass
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U snapclass" --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+psycopg://snapclass:test@localhost:5432/snapclass
      TEST_DATABASE_URL: postgresql+psycopg://snapclass:test@localhost:5432/snapclass_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-secret-that-is-long-enough-for-tests
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: mypy
      - name: Create test database
        run: PGPASSWORD=test psql -h localhost -U snapclass -c "CREATE DATABASE snapclass_test"
      - name: Migrations apply cleanly and match the models
        run: |
          alembic upgrade head
          alembic check
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
