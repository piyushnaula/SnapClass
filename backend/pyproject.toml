[project]
name = "snapclass"
version = "2.0.0"
description = "Face + voice attendance platform with human-in-the-loop review"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = [
    "B008",  # FastAPI uses function calls in defaults (Depends, File, Query)
    "S101",  # assert is fine in tests and for type narrowing
    "S603",  # subprocess with a fixed ffmpeg command list
    "S607",
    "S608",  # report SQL uses bound parameters, not string formatting
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # test passwords
"snapclass/scripts/seed.py" = ["E501"]  # long consent text paragraphs
"migrations/versions/*" = ["E501"]  # generated by Alembic

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["snapclass/domain", "snapclass/services"]
